[project]
name = "osusume"
version = "0.2.0"
description = "Evidence-gated recommendations for real-world places and events"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["PyYAML>=6.0,<7"]

[project.urls]
Homepage = "https://mbelinky.github.io/#osusume"
Repository = "https://github.com/mbelinky/osusume"
Issues = "https://github.com/mbelinky/osusume/issues"

[project.scripts]
osusume = "osusume.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
